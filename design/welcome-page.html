<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>小悟 AI 墨水屏 · A 屏欢迎页（黑白快刷）</title>
<style>
  :root{
    --ink:#111111;
    --paper:#f7f6f2;     /* 墨水屏底色（微暖白） */
    --bezel:#2a2a2a;
    --line:#cfcdc6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",-apple-system,system-ui,sans-serif;
    background:#e7e6e1;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:24px 16px;gap:14px;-webkit-font-smoothing:antialiased;
  }

  /* 设备外壳 + 4:3 墨水屏 */
  .device{
    background:linear-gradient(160deg,#333,#1c1c1c);
    padding:14px;border-radius:18px;box-shadow:0 18px 44px rgba(0,0,0,.28);
  }
  .epd{
    width:min(440px,92vw);aspect-ratio:4/3;
    background:var(--paper);
    border-radius:6px;
    padding:22px 22px 16px;
    position:relative;overflow:hidden;
    /* 轻微墨水屏纸纹 */
    background-image:radial-gradient(rgba(0,0,0,.025) 1px, transparent 1.3px);
    background-size:4px 4px;
    color:var(--ink);
    display:flex;flex-direction:column;
  }
  .logo{width:118px;margin:2px auto 10px;filter:grayscale(1) brightness(.92) contrast(1.05)}
  .logo svg{width:100%;height:auto;display:block}
  .greet{text-align:center;font-size:21px;font-weight:800;letter-spacing:.5px;line-height:1.3}
  .rule{height:2px;background:var(--ink);width:54px;margin:9px auto 12px}
  .body{font-size:13.5px;line-height:1.78;white-space:pre-line;text-align:center;flex:1}
  /* 黑白屏上用反白块强调群号，醒目且不依赖灰度 */
  .group{
    display:inline-block;background:var(--ink);color:#fff;
    font-size:17px;font-weight:800;letter-spacing:2px;
    padding:5px 14px;border-radius:5px;margin:4px 0 2px;
  }
  .footer{
    text-align:center;font-size:11.5px;color:#6b6b6b;
    border-top:1px solid var(--line);padding-top:8px;margin-top:8px;letter-spacing:.5px;
  }

  .caption{font-size:12px;color:#7a7872;text-align:center;max-width:440px;line-height:1.7}
  .caption b{color:var(--ink)}
</style>
</head>
<body>

      <div class="greet">你好大佬，<br/>欢迎来到小悟众创！</div>

  <p class="caption">
